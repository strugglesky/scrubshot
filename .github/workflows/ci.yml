name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # allowBuilds（esbuild / protobufjs / tesseract.js）写在 pnpm-workspace.yaml 里，
      # @sanduc 的 registry 写 .npmrc 里，二者都已提交，CI 不需要额外配置
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
